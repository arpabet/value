name: Value CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Keep go.arpabet.com modules off Google's public module proxy/checksum DB:
# GOPRIVATE expands to GONOPROXY + GONOSUMDB, so these modules are fetched
# directly from source and not cached by proxy.golang.org / sum.golang.org.
env:
  GOPRIVATE: go.arpabet.com/*

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25.x', '1.26.x' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # govulncheck@latest tracks the newest Go release (x/vuln v1.8.0+ needs
          # go >= 1.26), so this job scans with the current stable toolchain, not
          # the module's minimum. The scan is about dependencies; the standard
          # library version is each consumer's own toolchain anyway.
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Fuzz Unpack
        run: go test -run='^$' -fuzz=FuzzUnpack -fuzztime=40s

      - name: Fuzz Read
        run: go test -run='^$' -fuzz=FuzzRead -fuzztime=40s
